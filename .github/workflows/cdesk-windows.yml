name: cDesk Windows x64

on:
  push:
    branches: [cdesk-minimal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: Linux race and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...

  windows:
    name: Windows amd64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: ./dist/cdesk-socks5-windows-amd64.exe -version
        shell: pwsh
      - name: Verify implicit config from a different working directory
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./dist/cdesk-socks5-windows-amd64.exe).Path
          $config = Get-Content ./config.example.json -Raw | ConvertFrom-Json
          $config.auth.password = 'temporary-ci-config-check'
          $config.targets[0] | Add-Member -NotePropertyName ips -NotePropertyValue @('127.0.0.1')
          $config | ConvertTo-Json -Depth 10 | Set-Content ./dist/config.json -Encoding utf8NoBOM
          try {
            Push-Location $env:RUNNER_TEMP
            try {
              & $exe -check
              if ($LASTEXITCODE -ne 0) { throw 'Implicit EXE-directory configuration failed' }
            } finally { Pop-Location }
          } finally { Remove-Item -LiteralPath ./dist/config.json }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cdesk-socks5-windows-amd64
          path: dist/
          if-no-files-found: error
