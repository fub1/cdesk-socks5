name: cDesk Windows x64

on:
  push:
    branches: [cdesk-minimal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: Linux race and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...

  windows:
    name: Windows amd64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: ./dist/cdesk-socks5-windows-amd64.exe -version
        shell: pwsh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cdesk-socks5-windows-amd64
          path: dist/
          if-no-files-found: error
