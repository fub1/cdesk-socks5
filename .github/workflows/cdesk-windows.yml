name: cDesk Windows x64

on:
  push:
    branches: [cdesk-minimal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: Linux race and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...

  windows:
    name: Windows amd64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: ./dist/cdesk-socks5-windows-amd64.exe -version
        shell: pwsh
      - name: Test adapter against official OSS hbbs 1.1.16
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'cdesk-oss-integration'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          $archive = Join-Path $fixtureDir 'server.zip'
          Invoke-WebRequest 'https://github.com/rustdesk/rustdesk-server/releases/download/1.1.16/rustdesk-server-windows-x86_64-unsigned.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'b865a3a62fc8755b45480c508f1c4871c3338590408dda8c58c7e9c373b7adb0') { throw 'OSS fixture hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $fixtureDir
          $hbbs = Join-Path $fixtureDir 'x86_64/hbbs.exe'
          $server = Start-Process -FilePath $hbbs -ArgumentList @('-p','39116') -WorkingDirectory $fixtureDir -WindowStyle Hidden -RedirectStandardOutput (Join-Path $fixtureDir 'stdout.log') -RedirectStandardError (Join-Path $fixtureDir 'stderr.log') -PassThru
          try {
            $env:CDESK_OSS_TEST_ADDR = '127.0.0.1:39116'
            go test ./internal/gateway -run '^TestOSSRealServer$' -v -count=1
            if ($LASTEXITCODE -ne 0) { throw 'Real OSS integration failed' }
          } finally {
            Remove-Item Env:CDESK_OSS_TEST_ADDR -ErrorAction SilentlyContinue
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
          }
      - name: Verify implicit config from a different working directory
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./dist/cdesk-socks5-windows-amd64.exe).Path
          $config = Get-Content ./config.example.json -Raw | ConvertFrom-Json
          $config.auth.password = 'temporary-ci-config-check'
          $config.targets[0] | Add-Member -NotePropertyName ips -NotePropertyValue @('127.0.0.1')
          $config | ConvertTo-Json -Depth 10 | Set-Content ./dist/config.json -Encoding utf8NoBOM
          try {
            Push-Location $env:RUNNER_TEMP
            try {
              & $exe -check
              if ($LASTEXITCODE -ne 0) { throw 'Implicit EXE-directory configuration failed' }
            } finally { Pop-Location }
          } finally { Remove-Item -LiteralPath ./dist/config.json }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cdesk-socks5-windows-amd64
          path: |
            dist/*
            !dist/*.log
          if-no-files-found: error
